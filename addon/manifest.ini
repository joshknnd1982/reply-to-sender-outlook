name = replyToSenderOutlook
summary = "Reply to Sender for Microsoft Outlook"
description = """Adds NVDA+shift+r in Microsoft Outlook to reply directly to the original sender of the current message. It copies the sender's email address to the clipboard, opens the reply, replaces the To field with only the sender's address, and places focus at the top of the message body. Active only while Microsoft Outlook is running and focused. Once a day it also checks GitHub for a newer version."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
url = https://github.com/joshknnd1982/reply-to-sender-outlook
version = 0.3
changelog = "Checks GitHub for updates. Once a day, a little after NVDA starts, the add-on asks github.com/joshknnd1982/reply-to-sender-outlook whether a newer version has been released, and says nothing unless there is one. When there is, a dialog shows what's new and offers to download and install it; the download must match the release's SHA-256 checksum, and NVDA asks you to confirm the installation. To check yourself, choose Tools, Check for add-on updates, Reply to Sender for Microsoft Outlook in the NVDA menu, or press Check for updates now in the new Reply to Sender for Microsoft Outlook settings panel, where the daily check can also be turned off. The update check is a small global plugin that works while Outlook is closed; replying to the sender still happens only in Outlook."
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.1
