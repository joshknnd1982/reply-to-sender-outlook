name = replyToSenderOutlook
summary = "Reply to Sender for Microsoft Outlook"
description = """Adds NVDA+shift+r in Microsoft Outlook to reply directly to the original sender of the current message. It copies the sender's email address to the clipboard, opens the reply, replaces the To field with only the sender's address, and places focus at the top of the message body. Active only while Microsoft Outlook is running and focused."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
url = https://github.com/joshknnd1982/reply-to-sender-outlook
version = 0.1
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.1
